name: Trump Truth Social Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Python ───────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Emoji font ────────────────────────────────────────────────────────
      - name: Install emoji font
        run: sudo apt-get install -y fonts-noto-color-emoji

      # ── 4. Dependencies ──────────────────────────────────────────────────────
      - name: Install dependencies
        run: pip install requests pillow

      # ── 5. Run monitor ───────────────────────────────────────────────────────
      - name: Run monitor
        env:
          SCRAPINGANT_TOKEN: ${{ secrets.SCRAPINGANT_TOKEN }}
        run: python monitor_scrapingant.py

      # ── 6. Commit monitor output ─────────────────────────────────────────────
      - name: Commit monitor changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f posts.md last_post_id.txt seen_post_ids.txt 2>/dev/null || true
          git add -f images/ 2>/dev/null || true
          if [ -z "$(git status --porcelain)" ]; then
            echo "No new posts – skipping commit."
          else
            git commit -m "chore: new Truth post detected $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # ── 7. Post to Mastodon ──────────────────────────────────────────────────
      - name: Post to Mastodon
        env:
          MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: python mastodon_poster.py

      # ── 8. Commit Mastodon state ─────────────────────────────────────────────
      - name: Commit Mastodon state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f last_mastodon_post_id.txt 2>/dev/null || true
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing posted – no commit needed."
          else
            git commit -m "chore: mastodon post published $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
