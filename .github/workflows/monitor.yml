name: Trump Truth Social Monitor

on:
  schedule:
    # Runs every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:   # allow manual trigger from the Actions tab

permissions:
  contents: write      # needed to commit posts.md, last_post_id.txt, images/

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      # ── 1. Checkout the repository ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Set up Python ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install emoji font (needed for 🤡 rendering on the card) ─────────
      - name: Install emoji font
        run: sudo apt-get install -y fonts-noto-color-emoji

      # ── 4. Install Python dependencies ──────────────────────────────────────
      - name: Install dependencies
        run: pip install requests pillow

      # ── 5. Run the monitor script ───────────────────────────────────────────
      - name: Run monitor
        env:
          SCRAPINGANT_TOKEN: ${{ secrets.SCRAPINGANT_TOKEN }}
        run: python monitor_scrapingant.py

      # ── 6. Commit & push any changes ────────────────────────────────────────
      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage all relevant files (including new untracked ones)
          git add -f posts.md last_post_id.txt 2>/dev/null || true
          git add -f images/   2>/dev/null || true

          # Use git status --porcelain to detect BOTH modified and new files
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed – no commit needed."
          else
            git commit -m "chore: new Truth post detected $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
